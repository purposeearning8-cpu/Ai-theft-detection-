name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install fastapi uvicorn opencv-python-headless ultralytics numpy pywebview pyinstaller

      - name: Download YOLO Weights
        run: |
          python -c "from ultralytics import YOLO; YOLO('yolov8n.pt')"

      - name: Build Executable with PyInstaller
        run: |
          pyinstaller --noconsole --onefile --collect-all ultralytics --add-data "yolov8n.pt;." app.py

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-CCTV-Sentinel-Windows
          path: dist/app.exe
